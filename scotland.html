<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scotland's Scenic Map has moved</title>
<link rel="canonical" href="https://mstevana.github.io/scotland/">
<!-- The map now lives at https://mstevana.github.io/scotland/ (repo: mstevana/scotland).
     This page stays behind so old links keep working. The script forwards the query
     string and hash, which matters because shared links carry the path selection in
     ?path=<code>; the meta refresh below is a no-JS fallback and cannot preserve it. -->
<script>
  location.replace("https://mstevana.github.io/scotland/" + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://mstevana.github.io/scotland/">
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;
       min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#E7E2CE;color:#1B1D1B;text-align:center;padding:24px;}
  a{color:#1B6B79;}
</style>
</head>
<body>
<p>Scotland's Scenic Map has moved to
   <a href="https://mstevana.github.io/scotland/">mstevana.github.io/scotland/</a>.</p>
</body>
</html>
