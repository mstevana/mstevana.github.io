<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crawl has moved</title>
<link rel="canonical" href="https://mstevana.github.io/crawl/">
<!-- The game now lives at https://mstevana.github.io/crawl/ (repo: mstevana/crawl).
     This page stays behind so old links, bookmarks and any home-screen shortcut
     installed from here keep working. The new URL is on the same origin, so the
     save, the best depth, the bestiary and the graphics setting — all held in
     localStorage — carry over untouched. The script forwards the query string and
     hash; the meta refresh below is a no-JS fallback and cannot preserve them. -->
<script>
  location.replace("https://mstevana.github.io/crawl/" + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://mstevana.github.io/crawl/">
<style>
  body{font-family:Georgia,"Times New Roman",serif;margin:0;
       min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#070605;color:#c9b98a;text-align:center;padding:24px;}
  a{color:#e0cf9e;}
</style>
</head>
<body>
<p>Crawl has moved to
   <a href="https://mstevana.github.io/crawl/">mstevana.github.io/crawl/</a>.</p>
</body>
</html>
