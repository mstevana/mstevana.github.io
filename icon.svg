<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#4a3d2a"/>
      <stop offset="52%" stop-color="#282118"/>
      <stop offset="100%" stop-color="#0d0b09"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#7e838a"/>
      <stop offset="38%" stop-color="#d4d7dc"/>
      <stop offset="52%" stop-color="#eef0f3"/>
      <stop offset="70%" stop-color="#a8adb4"/>
      <stop offset="100%" stop-color="#6d7278"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#8a6b3c"/>
      <stop offset="55%" stop-color="#6b4a2c"/>
      <stop offset="100%" stop-color="#4a321d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c98f"/>
      <stop offset="100%" stop-color="#8a7343"/>
    </linearGradient>
    <filter id="cast" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity="0.62"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Shield left, sword right, standing apart. They are still warm against
       cold: side by side the gap does some of the separating, but two grey
       objects this close still merge into one mass at 60px, so the colour split
       is doing most of the work and is kept. -->
  <g filter="url(#cast)" transform="translate(156,262) scale(5.6) translate(-32,-32)">
    <path d="M32 4 Q48 6 50 12 Q50 42 32 60 Q14 42 14 12 Q16 6 32 4 Z"
          fill="#2a1c0f"/>
    <path d="M32 6.2 Q46.4 8.2 48.2 13.4 Q48.2 41 32 57.4 Q15.8 41 15.8 13.4 Q17.6 8.2 32 6.2 Z"
          fill="url(#face)"/>
    <!-- rim studs: a shield reads as MADE from its fittings -->
    <g fill="#c9b37e" opacity="0.92">
      <circle cx="22.5" cy="10.5" r="1.5"/><circle cx="41.5" cy="10.5" r="1.5"/>
      <circle cx="17.6" cy="22"   r="1.5"/><circle cx="46.4" cy="22"   r="1.5"/>
      <circle cx="20.5" cy="36"   r="1.5"/><circle cx="43.5" cy="36"   r="1.5"/>
    </g>
    <path d="M32 47.5 Q22 38 20 26" stroke="#c9b37e" stroke-width="1.1" fill="none" opacity="0.30"/>
  </g>

  <!-- Point up: a blade angled down reads as surrender, and at icon size a
       vertical is the strongest line available. The crossguard is what gives the
       sword horizontal mass — without it the right half of the tile reads empty
       beside the shield. -->
  <g filter="url(#cast)" transform="translate(368,256) scale(5.9) translate(-32,-32)">
    <path d="M32 1.6 L35.4 8.6 L35.4 42 L32 48.5 L28.6 42 L28.6 8.6 Z" fill="#1d1f22"/>
    <path d="M32 3.0 L34.6 9.2 L34.6 41.4 L32 47 L29.4 41.4 L29.4 9.2 Z" fill="url(#steel)"/>
    <path d="M32 4.6 L32 45.5" stroke="#f2f4f7" stroke-width="0.8" opacity="0.85"/>
    <rect x="19" y="41.6" width="26" height="5.4" rx="2.2" fill="#2a1c0f"/>
    <rect x="20" y="42.4" width="24" height="3.8" rx="1.7" fill="url(#gold)"/>
    <rect x="28.6" y="47" width="6.8" height="11.5" rx="1.4" fill="#2a1c0f"/>
    <rect x="29.4" y="47.6" width="5.2" height="10.3" rx="1.1" fill="#5a4326"/>
    <circle cx="32" cy="60.4" r="3.7" fill="#2a1c0f"/>
    <circle cx="32" cy="60.2" r="2.9" fill="url(#gold)"/>
  </g>
</svg>
